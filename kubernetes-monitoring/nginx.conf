server {
    listen 80;                          # слушаем HTTP на порту 80
    server_name _;                      # отвечаем на любое имя хоста (catch-all)

    location / {                        # обработка обычных запросов к сайту
        root   /usr/share/nginx/html;   # корень со статикой по умолчанию
        index  index.html;              # файл, отдаваемый по запросу каталога
    }

    # Отдельный путь для статус-метрик
    location /stub_status {             # эндпоинт со статистикой nginx
        stub_status;                    # включаем модуль ngx_http_stub_status_module
        allow 127.0.0.1;                # доступ только локально (для sidecar-экспортера)
        deny all;                       # всем остальным — запретить
    }
}