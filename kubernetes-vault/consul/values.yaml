global:
  name: consul
  datacenter: dc1

server:
  enabled: true
  replicas: 3
  bootstrapExpect: 3

  storage: 10Gi

  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 500m

client:
  enabled: true

connectInject:
  enabled: false

ui:
  enabled: true
  service:
    type: ClusterIP
